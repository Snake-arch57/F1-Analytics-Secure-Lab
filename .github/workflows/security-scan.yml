name: security-scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  gitleaks:
    name: Segredos vazados (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # historico completo: segredo antigo tambem conta
      - name: Instalar gitleaks
        run: |
          VER=8.21.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Varrer historico
        # --redact impede que o segredo apareca no log do CI (seria um segundo vazamento)
        # --exit-code 1 derruba o build de proposito: este job NAO e decorativo
        run: gitleaks detect --source . --redact --verbose --exit-code 1

  bandit:
    name: Análise estática (Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install bandit
      - run: bandit -r . -x ./.venv,./tests -f screen
        continue-on-error: true

  trivy:
    name: Vulnerabilidades de dependências (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "0"
